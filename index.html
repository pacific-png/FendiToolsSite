<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jamieson's Transactions | Premium Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #030303;
      color: #f0fff0;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ===== PARTICLE CANVAS BACKGROUND (waves & moving dots) ===== */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, #0a1f0a, #010101);
    }

    /* additional animated glow for depth */
    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 70% 40%, rgba(0, 255, 100, 0.08) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 1;
      animation: pulseGlow 8s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1);}
      100% { opacity: 0.8; transform: scale(1.1);}
    }

    /* main content wrapper */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem 1.5rem;
      backdrop-filter: blur(1px);
    }

    /* Hero text styling - BIG & BOLD */
    .hero-title {
      font-size: clamp(2.8rem, 10vw, 5.8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #B3FFB0, #2A9D4E, #0F4C2A);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(50, 255, 50, 0.4);
      margin-bottom: 2rem;
      animation: titleFloat 1.2s ease-out, gradientShift 10s ease infinite;
    }

    @keyframes titleFloat {
      0% { opacity: 0; transform: translateY(40px); filter: blur(10px);}
      100% { opacity: 1; transform: translateY(0); filter: blur(0);}
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* single credit card container */
    .card-container {
      perspective: 1200px;
      width: 100%;
      max-width: 500px;
      margin: 1.5rem auto 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    /* the interactive card itself */
    .interactive-card {
      width: 100%;
      max-width: 380px;
      background: rgba(10, 30, 15, 0.6);
      backdrop-filter: blur(14px);
      border-radius: 32px;
      border: 1px solid rgba(70, 255, 100, 0.6);
      box-shadow: 0 30px 45px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(50,255,100,0.3) inset, 0 0 28px rgba(0,255,0,0.2);
      padding: 2rem 1.8rem;
      transition: transform 0.2s ease-out, box-shadow 0.3s ease, border-color 0.2s;
      transform-style: preserve-3d;
      will-change: transform;
      font-family: 'Inter', monospace;
      letter-spacing: 0.5px;
    }

    /* hover scale + tilt is applied via JS, but we also add a scale on hover for extra effect */
    .interactive-card:hover {
      transform: scale(1.05) rotateX(0deg) rotateY(0deg); /* base scale, tilt overrides via inline style */
      border-color: #7affa0;
      box-shadow: 0 40px 60px -20px black, 0 0 0 2px rgba(100,255,130,0.7) inset, 0 0 35px #3eff7a;
    }

    /* credit card inner elements */
    .card-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .chip-icon {
      width: 52px;
      height: 42px;
      background: linear-gradient(145deg, #e0b47e, #b2813a);
      border-radius: 14px;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .chip-icon::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 10px;
      width: 30px;
      height: 20px;
      background: repeating-linear-gradient(45deg, #ddaf6c, #ddaf6c 4px, #c48a3a 4px, #c48a3a 8px);
      border-radius: 8px;
    }
    .card-network {
      font-size: 0.9rem;
      font-weight: 700;
      background: rgba(0,0,0,0.55);
      padding: 6px 14px;
      border-radius: 40px;
      letter-spacing: 1px;
      color: #d0ffc0;
      backdrop-filter: blur(4px);
    }

    .card-number {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff, #c0ffc0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 6px #2aa044;
      margin: 1rem 0 0.8rem 0;
    }

    .card-details {
      display: flex;
      justify-content: space-between;
      margin-top: 0.8rem;
    }
    .card-holder, .card-expiry {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #e0ffe0;
      font-weight: 400;
      background: rgba(0,0,0,0.4);
      padding: 6px 12px;
      border-radius: 30px;
      backdrop-filter: blur(2px);
    }
    .card-holder span, .card-expiry span {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: white;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* responsive adjustments */
    @media (max-width: 550px) {
      .interactive-card {
        max-width: 320px;
        padding: 1.5rem;
      }
      .card-number {
        font-size: 1.2rem;
        letter-spacing: 2px;
      }
      .hero-title {
        margin-bottom: 1rem;
      }
    }

    /* floating decorative dots (spot theme) */
    .floating-dots {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
    }
    .dot {
      position: absolute;
      background: radial-gradient(circle, #4eff7c, #177a2e);
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.45;
      animation: floatDot 14s infinite alternate ease-in-out;
      box-shadow: 0 0 15px #2eff6e;
    }

    @keyframes floatDot {
      0% { transform: translate(0, 0) scale(1); opacity: 0.2;}
      100% { transform: translate(35px, -45px) scale(1.25); opacity: 0.7;}
    }

    /* extra micro interaction hint */
    .instruction {
      font-size: 0.85rem;
      margin-top: 1rem;
      color: #9eff9e;
      background: rgba(0,20,0,0.5);
      padding: 0.4rem 1rem;
      border-radius: 60px;
      display: inline-block;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(100,255,100,0.3);
    }
  </style>
</head>
<body>

  <!-- Particle Canvas Background (dynamic wave + moving dots) -->
  <canvas id="particleCanvas"></canvas>
  <div class="bg-glow"></div>
  
  <!-- Additional floating spot elements -->
  <div class="floating-dots" id="floatingDots"></div>

  <div class="content">
    <h1 class="hero-title">Thanks for using<br>Jamieson's Transactions</h1>

    <!-- SINGLE CREDIT CARD MODEL with mouse tracking tilt + scale on hover -->
    <div class="card-container" id="cardContainer">
      <div class="interactive-card" id="creditCard">
        <div class="card-chip">
          <div class="chip-icon"></div>
          <div class="card-network">PREMIUM</div>
        </div>
        <div class="card-number">**** 8823 **** 4710</div>
        <div class="card-details">
          <div class="card-holder">CARDHOLDER <span>USER</span></div>
          <div class="card-expiry">VALID THRU <span>12/29</span></div>
        </div>
      </div>
    </div>
    <div class="instruction">🖱️ HOVER → Card tilts & enlarges</div>
  </div>

  <script>
    (function() {
      // ======================
      // 1. DYNAMIC PARTICLE WAVE BACKGROUND (moving dots + organic flow)
      // ======================
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      let mouseX = null, mouseY = null;

      const PARTICLE_COUNT = 380;
      const MAX_SPEED = 0.75;
      const WAVE_INTENSITY = 1.3;

      class Particle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.originX = x;
          this.originY = y;
          this.vx = (Math.random() - 0.5) * MAX_SPEED;
          this.vy = (Math.random() - 0.5) * MAX_SPEED;
          this.size = Math.random() * 2.8 + 1.0;
          this.alpha = Math.random() * 0.55 + 0.2;
          this.greenHue = 80 + Math.random() * 100;
        }

        update(time, mouseEffectX, mouseEffectY) {
          // wave flow using sine/cosine based on position and time
          let waveX = Math.sin(time * 0.0022 + this.y * 0.009) * WAVE_INTENSITY;
          let waveY = Math.cos(time * 0.0019 + this.x * 0.008) * WAVE_INTENSITY;
          
          let mouseInfluence = { x: 0, y: 0 };
          if (mouseEffectX !== null && mouseEffectY !== null) {
            let dx = mouseEffectX - this.x;
            let dy = mouseEffectY - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist < 180) {
              let force = (180 - dist) / 2200;
              mouseInfluence.x = dx * force;
              mouseInfluence.y = dy * force;
            }
          }
          
          this.vx += waveX * 0.022 + mouseInfluence.x;
          this.vy += waveY * 0.022 + mouseInfluence.y;
          
          // damping
          this.vx *= 0.985;
          this.vy *= 0.985;
          let spd = Math.hypot(this.vx, this.vy);
          if (spd > 2.4) {
            this.vx = (this.vx / spd) * 2.2;
            this.vy = (this.vy / spd) * 2.2;
          }
          
          this.x += this.vx;
          this.y += this.vy;
          
          // boundaries with soft bounce
          if (this.x < 0) { this.x = 0; this.vx *= -0.92; }
          if (this.x > width) { this.x = width; this.vx *= -0.92; }
          if (this.y < 0) { this.y = 0; this.vy *= -0.92; }
          if (this.y > height) { this.y = height; this.vy *= -0.92; }
        }
        
        draw(ctx) {
          ctx.beginPath();
          const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2.2);
          grad.addColorStop(0, `rgba(90, 255, 130, ${this.alpha + 0.2})`);
          grad.addColorStop(1, `rgba(20, 100, 40, ${this.alpha * 0.9})`);
          ctx.fillStyle = grad;
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 7;
          ctx.shadowColor = "#5eff8e";
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          let x = Math.random() * width;
          let y = Math.random() * height;
          particles.push(new Particle(x, y));
        }
      }

      let animationTime = Date.now();
      function animateParticles() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        
        // dark greenish-black gradient
        const bgGrad = ctx.createLinearGradient(0, 0, width, height);
        bgGrad.addColorStop(0, '#031003');
        bgGrad.addColorStop(1, '#001000');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);
        
        // draw connections between close particles (web-like)
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let dist = Math.hypot(dx, dy);
            if (dist < 95) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(80, 220, 90, ${0.18 - dist / 700})`;
              ctx.lineWidth = 0.65;
              ctx.stroke();
            }
          }
        }
        
        let now = Date.now();
        animationTime = now;
        let mouseCurrentX = (mouseX !== null) ? mouseX : null;
        let mouseCurrentY = (mouseY !== null) ? mouseY : null;
        for (let p of particles) {
          p.update(now, mouseCurrentX, mouseCurrentY);
          p.draw(ctx);
        }
        
        // sparkle particles
        for (let i = 0; i < 50; i++) {
          if (i % 5 === 0 && particles[i]) {
            let xSpark = (Math.sin(now * 0.006 + i) * 45 + particles[i].x);
            let ySpark = (Math.cos(now * 0.005 + i * 1.7) * 35 + particles[i].y);
            ctx.beginPath();
            ctx.arc(xSpark, ySpark, 1.3, 0, Math.PI*2);
            ctx.fillStyle = `rgba(130, 255, 140, 0.85)`;
            ctx.fill();
          }
        }
        
        requestAnimationFrame(animateParticles);
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initParticles();
      }
      
      // track mouse movement for particle influence & card tilt
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        // reset after short delay for subtle particle drag
        clearTimeout(window.mouseResetTimeout);
        window.mouseResetTimeout = setTimeout(() => {
          mouseX = null;
          mouseY = null;
        }, 180);
      });
      
      window.addEventListener('resize', () => {
        resizeCanvas();
      });
      
      resizeCanvas();
      animateParticles();
      
      // ======================
      // 2. FLOATING DOTS (spot theme extra)
      // ======================
      const dotsContainer = document.getElementById('floatingDots');
      for (let i = 0; i < 70; i++) {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        const size = Math.random() * 13 + 3;
        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.left = `${Math.random() * 100}%`;
        dot.style.top = `${Math.random() * 100}%`;
        dot.style.animationDelay = `${Math.random() * 9}s`;
        dot.style.animationDuration = `${Math.random() * 15 + 7}s`;
        dot.style.filter = `blur(${Math.random() * 3 + 1}px)`;
        dotsContainer.appendChild(dot);
      }
      
      // animate floating dots shifting gently
      setInterval(() => {
        const allDots = document.querySelectorAll('.dot');
        for (let d of allDots) {
          if (Math.random() > 0.75) {
            let currentLeft = parseFloat(d.style.left);
            let currentTop = parseFloat(d.style.top);
            let deltaX = (Math.random() - 0.5) * 15;
            let deltaY = (Math.random() - 0.5) * 15;
            let newLeft = Math.min(Math.max(currentLeft + deltaX, -5), 105);
            let newTop = Math.min(Math.max(currentTop + deltaY, -5), 105);
            d.style.left = `${newLeft}%`;
            d.style.top = `${newTop}%`;
          }
        }
      }, 2500);
      
      // ======================
      // 3. SINGLE CREDIT CARD: MOUSE TILT + HOVER SCALE
      // ======================
      const card = document.getElementById('creditCard');
      const container = document.getElementById('cardContainer');
      
      // Tilt effect based on mouse position relative to card
      function handleCardTilt(e) {
        if (!card) return;
        const rect = card.getBoundingClientRect();
        // calculate mouse position relative to card center
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const mouseRelativeX = e.clientX - centerX;
        const mouseRelativeY = e.clientY - centerY;
        
        // max rotation angles (degrees)
        const maxRotateX = 14;   // vertical tilt
        const maxRotateY = 18;   // horizontal tilt
        
        // calculate rotation based on distance from center (clamped)
        let rotateY = (mouseRelativeX / (rect.width / 2)) * maxRotateY;
        let rotateX = -(mouseRelativeY / (rect.height / 2)) * maxRotateX;
        
        // clamp values
        rotateY = Math.min(maxRotateY, Math.max(-maxRotateY, rotateY));
        rotateX = Math.min(maxRotateX, Math.max(-maxRotateX, rotateX));
        
        // apply transform: scale(1.05) on hover + dynamic tilt
        // but we only add tilt while hover; scale already from CSS hover but we want tilt to override without losing scale.
        // We'll use inline style to combine scale + rotate. However CSS .interactive-card:hover sets scale(1.05).
        // To avoid conflict, we manage inline transform that includes both. We'll detect hover state and set scale inside.
        // Better approach: use JS to manage both on mousemove and also listen to mouseleave.
        if (cardMatchesHover) {
          // Apply both tilt and scale
          card.style.transform = `perspective(1200px) scale(1.05) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        } else {
          // if not hover, just keep default with no scale but maybe slight tilt? we want tilt only on hover.
          card.style.transform = '';
        }
      }
      
      let cardMatchesHover = false;
      
      function onMouseEnterCard() {
        cardMatchesHover = true;
        card.style.transition = 'transform 0.12s ease-out';
        // slight enhancement: border glow
        card.style.borderColor = '#9affb0';
        // start listening to mousemove globally for tilt relative to card
        window.addEventListener('mousemove', handleCardTilt);
        // trigger initial tilt based on current mouse position
        if (window.lastMouseEvent) {
          handleCardTilt(window.lastMouseEvent);
        } else {
          // fallback default scaling
          card.style.transform = 'perspective(1200px) scale(1.05) rotateX(0deg) rotateY(0deg)';
        }
      }
      
      function onMouseLeaveCard() {
        cardMatchesHover = false;
        window.removeEventListener('mousemove', handleCardTilt);
        card.style.transform = '';
        card.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
        card.style.borderColor = '';
        // reset any inline style after transition
        setTimeout(() => {
          if (!cardMatchesHover) {
            card.style.transform = '';
          }
        }, 200);
      }
      
      // store last mouse event for immediate tilt
      window.addEventListener('mousemove', (e) => {
        window.lastMouseEvent = e;
      });
      
      card.addEventListener('mouseenter', onMouseEnterCard);
      card.addEventListener('mouseleave', onMouseLeaveCard);
      
      // additional micro effect: ensure card container doesn't cause unintended interference
      container.addEventListener('mouseenter', () => {});
      
      // also ensure that if mouse moves quickly while over card, tilt updates smoothly.
      // our handleCardTilt uses latest coords, fine.
      
      // small extra: add a subtle shadow intensity change during hover via CSS
      const style = document.createElement('style');
      style.textContent = `
        .interactive-card:hover {
          box-shadow: 0 35px 55px -18px black, 0 0 0 2px rgba(100,255,140,0.8) inset, 0 0 38px #3eff8a !important;
          border-color: #b4ffc0;
        }
      `;
      document.head.appendChild(style);
      
      // pre-set transition on card for smoothness
      card.style.transition = 'transform 0.2s ease-out, box-shadow 0.2s, border-color 0.2s';
      
      // remove any leftover carousel elements - ensure only one card
      // also remove subhead/button etc from content - we've already removed them in HTML
      // final step: ensure no old interactive elements remain.
      
      // optional hover instruction subtlety
      console.log('Single interactive card ready — tilts toward mouse & enlarges on hover');
      
      // Bonus: to make particles and spot theme more lively, add slight rotation to floating dots container on mousemove over card?
      // not needed, already cool.
    })();
  </script>
</body>
</html>
